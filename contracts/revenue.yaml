kpi: revenue
display_name: "Revenue"
definition: "sum(sales) net of returns, per region/segment/day"
source:
  table: transactions.sales
  columns: [order_date, region, segment, sales]
grain: daily
refresh_cadence: daily
materiality_threshold:
  statistical: "actual falls outside seasonal_baseline_mean +/- 2*std (8-week trailing window)"
  business: "absolute impact > $50,000 OR > 5% of trailing 8-week average for the slice"
  # machine-readable fields -- detect.py reads these directly, prose above is
  # for humans/LLM context only and must be kept in sync manually
  std_multiplier: 2.0
  window_periods: 8
  business_abs_threshold: 50000
  business_pct_threshold: 0.05
  combine_rule: "OR"  # flag if EITHER statistical OR business test trips
  value_column: "revenue"
owner: "Regional Sales Ops"
lineage: "transactions.raw_sales -> daily_agg_by_region_segment -> kpi_revenue"
access:
  regional_manager: "row-filtered to own region only"
  finance_vp: "all regions, aggregated only (no account-level rows)"
notes: >
  Primary anomaly-detection KPI. Feeds Decompose stage directly since it has
  the richest dimensional breakdown (region x segment x category).
