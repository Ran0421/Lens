kpi: order_volume
display_name: "Order Volume"
definition: "count(distinct order_id), per region/segment/day"
source:
  table: transactions.sales
  columns: [order_date, region, segment, order_id]
grain: daily
refresh_cadence: daily
materiality_threshold:
  statistical: "actual falls outside seasonal_baseline_mean +/- 2*std (8-week trailing window)"
  business: "absolute change > 20 orders/day for the slice OR > 8% relative change"
  std_multiplier: 2.0
  window_periods: 8
  business_abs_threshold: 20
  business_pct_threshold: 0.08
  combine_rule: "OR"
  value_column: "order_volume"
owner: "Regional Sales Ops"
lineage: "transactions.raw_sales -> daily_count_by_region_segment -> kpi_order_volume"
access:
  regional_manager: "row-filtered to own region only"
  finance_vp: "all regions, aggregated only"
notes: >
  Used alongside Revenue to distinguish a price-driven movement (revenue
  moves, volume flat) from a demand-driven movement (both move together).
