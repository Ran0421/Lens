kpi: profit_margin
display_name: "Profit Margin %"
definition: "sum(profit) / sum(sales), per region/segment/day"
source:
  table: transactions.sales
  columns: [order_date, region, segment, sales, profit]
grain: daily
refresh_cadence: daily
materiality_threshold:
  statistical: "actual falls outside seasonal_baseline_mean +/- 1.5*std (8-week trailing window)"
  business: "absolute margin-point change > 2pp for the slice"
  std_multiplier: 1.5
  window_periods: 8
  business_abs_threshold: 0.02
  business_pct_threshold: null
  combine_rule: "OR"
  value_column: "profit_margin"
owner: "Finance"
lineage: "transactions.raw_sales -> daily_agg_by_region_segment -> kpi_profit_margin"
access:
  regional_manager: "row-filtered to own region only"
  finance_vp: "all regions"
notes: >
  Margin moves are frequently a downstream symptom of a Revenue or Discount
  Rate movement already flagged -- Explain stage checks for this correlation
  before treating a margin anomaly as independent.
