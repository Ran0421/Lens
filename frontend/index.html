<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lens — KPI storytelling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101a2b; --navy-2:#16233a;
    --teal:#0f766e; --teal-light:#e6f5f3;
    --danger:#c0392b; --danger-light:#fdecea;
    --amber:#b8860b; --amber-light:#fdf3e0;
    --text:#1c2430; --muted:#6b7280; --border:#e5e7eb; --bg:#f7f8fa;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--navy);color:#fff;padding:24px 16px;flex-shrink:0;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
  .brand-dot{width:32px;height:32px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;}
  .brand-name{font-weight:600;font-size:16px;}
  .brand-sub{font-size:11px;color:#9aa5b8;}
  .nav-item{padding:10px 12px;border-radius:8px;font-size:14px;color:#c7cedb;margin-bottom:4px;cursor:default;}
  .nav-item.active{background:rgba(255,255,255,0.08);color:#fff;}
  .main{flex:1;padding:32px 40px;max-width:1100px;}
  h1{font-size:26px;font-weight:700;margin:0 0 4px;}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:24px;}
  .persona-row{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
  .persona-btn{border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;color:var(--muted);}
  .persona-btn.active{border-color:var(--teal);color:var(--teal);background:var(--teal-light);font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;}
  .card.anomaly{border-color:var(--danger);background:linear-gradient(180deg,#fff,var(--danger-light));position:relative;}
  .badge{position:absolute;top:-10px;right:16px;background:var(--danger);color:#fff;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;}
  .kpi-label{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .kpi-value{font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .kpi-delta{font-size:13px;margin-top:4px;}
  .up{color:#1a7f4a;} .down{color:var(--danger);}
  .freshness{font-size:11px;color:var(--muted);margin-top:8px;font-style:italic;}
  .ask-btn{margin-top:14px;background:var(--teal);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .ask-btn:hover{filter:brightness(1.08);}
  .ask-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .scenario-row{display:flex;gap:8px;margin-bottom:20px;}
  .scenario-btn{border:1px solid var(--border);background:#fff;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;}
  .scenario-btn.active{border-color:var(--amber);background:var(--amber-light);font-weight:600;}

  .stage-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
  .stage-title{font-weight:600;font-size:15px;margin-bottom:4px;}
  .stage-sub{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .cause-box{border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .cause-box.high{background:#eafaf3;border:1px solid #b7ebd3;}
  .conf-pill{font-size:11px;font-family:'IBM Plex Mono',monospace;padding:2px 10px;border-radius:20px;background:#d1f5e5;color:#0a7a4b;float:right;}
  .gap-box{border:1px dashed var(--danger);background:var(--danger-light);border-radius:10px;padding:14px 16px;font-size:13.5px;color:#7a2e24;}
  .rec-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .rec-item:last-child{border-bottom:none;}
  .feedback-row{display:flex;gap:8px;margin-top:14px;}
  .fb-btn{border:1px solid var(--border);background:#fff;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
  .fb-btn.confirm:hover{border-color:#1a7f4a;color:#1a7f4a;}
  .fb-btn.reject:hover{border-color:var(--danger);color:var(--danger);}

  .telemetry{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;gap:20px;flex-wrap:wrap;}
  .placeholder{color:var(--muted);font-size:13.5px;font-style:italic;padding:20px 0;}
  .rbac-note{font-size:12px;color:var(--muted);background:var(--teal-light);border-radius:8px;padding:8px 12px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-dot">L</div>
      <div><div class="brand-name">Lens</div><div class="brand-sub">KPI storytelling</div></div>
    </div>
    <div class="nav-item active">Dashboard</div>
    <div class="nav-item">Lens Insights</div>
    <div class="nav-item">History</div>
  </div>

  <div class="main">
    <h1>Revenue Operations Dashboard</h1>
    <div class="subtitle">Live prototype — running against the real FastAPI backend, not scripted</div>

    <div class="persona-row" id="personaRow"></div>
    <div class="rbac-note" id="rbacNote"></div>

    <div class="grid" id="kpiGrid">
      <div class="placeholder">Loading dashboard…</div>
    </div>

    <div class="stage-card">
      <div class="stage-title">Investigate an anomaly</div>
      <div class="stage-sub">Choose a scenario, then run the pipeline live</div>
      <div class="scenario-row" id="scenarioRow"></div>
      <button class="ask-btn" id="investigateBtn" onclick="runInvestigation()">Ask Lens why →</button>
    </div>

    <div id="results"></div>
    <div id="telemetryBox"></div>
  </div>
</div>

<script>
const PERSONAS = [
  {id: "regional_manager_west", label: "Regional Mgr — West"},
  {id: "regional_manager_east", label: "Regional Mgr — East"},
  {id: "finance_vp", label: "Finance VP"},
];
const SCENARIOS = [
  {id: "clear", label: "Clear signal"},
  {id: "ambiguous", label: "Ambiguous signal"},
];

let currentPersona = "finance_vp";
let currentScenario = "clear";

function renderPersonaRow(){
  const row = document.getElementById("personaRow");
  row.innerHTML = "";
  PERSONAS.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "persona-btn" + (p.id === currentPersona ? " active" : "");
    btn.textContent = p.label;
    btn.onclick = () => { currentPersona = p.id; renderPersonaRow(); loadDashboard(); };
    row.appendChild(btn);
  });
  const note = document.getElementById("rbacNote");
  if(currentPersona === "finance_vp"){
    note.textContent = "Viewing as Finance VP — all regions, aggregated only, no account-level detail.";
  } else {
    const region = currentPersona.includes("west") ? "West" : "East";
    note.textContent = `Viewing as Regional Manager — row-filtered to ${region} only.`;
  }
}

function renderScenarioRow(){
  const row = document.getElementById("scenarioRow");
  row.innerHTML = "";
  SCENARIOS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "scenario-btn" + (s.id === currentScenario ? " active" : "");
    btn.textContent = s.label;
    btn.onclick = () => { currentScenario = s.id; renderScenarioRow(); };
    row.appendChild(btn);
  });
}

async function loadDashboard(){
  const grid = document.getElementById("kpiGrid");
  grid.innerHTML = `<div class="placeholder">Loading dashboard…</div>`;
  try{
    const res = await fetch("/api/dashboard", {headers: {"X-Persona-Id": currentPersona}});
    const data = await res.json();
    grid.innerHTML = "";
    data.kpis.forEach(k => {
      const isUp = k.delta_pct >= 0;
      const card = document.createElement("div");
      card.className = "card" + (k.anomaly ? " anomaly" : "");
      card.innerHTML = `
        ${k.anomaly ? '<div class="badge">Anomaly</div>' : ''}
        <div class="kpi-label">${k.kpi.replace(/_/g," ")}</div>
        <div class="kpi-value">${typeof k.value === "number" && k.value > 1000 ? "$"+(k.value/1000).toFixed(0)+"K" : k.value}</div>
        <div class="kpi-delta ${isUp?'up':'down'}">${isUp?'↗':'↘'} ${Math.abs(k.delta_pct)}%</div>
        ${k.freshness_note ? `<div class="freshness">${k.freshness_note}</div>` : ''}
      `;
      grid.appendChild(card);
    });
  } catch(err){
    grid.innerHTML = `<div class="placeholder">Could not reach the API. Is the backend running?</div>`;
  }
}

async function runInvestigation(){
  const btn = document.getElementById("investigateBtn");
  const results = document.getElementById("results");
  const telemetryBox = document.getElementById("telemetryBox");
  btn.disabled = true;
  results.innerHTML = `<div class="placeholder">Running Localize → Explain → Recommend…</div>`;
  telemetryBox.innerHTML = "";

  try{
    const res = await fetch("/api/investigate", {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Persona-Id": currentPersona},
      body: JSON.stringify({kpi: "revenue_northeast", scenario: currentScenario})
    });
    const data = await res.json();
    renderResults(data);
  } catch(err){
    results.innerHTML = `<div class="placeholder">Investigation failed — check the API is running.</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderResults(data){
  const results = document.getElementById("results");
  const telemetryBox = document.getElementById("telemetryBox");

  let html = `
    <div class="stage-card">
      <div class="stage-title">Localize</div>
      <div class="stage-sub">${data.localize.summary}</div>
    </div>
    <div class="stage-card">
      <div class="stage-title">Explain</div>`;

  data.causes.forEach((c, i) => {
    html += `
      <div class="cause-box high">
        <span class="conf-pill">${c.confidence} confidence</span>
        <div>${c.name}</div>
        <div class="feedback-row">
          <button class="fb-btn confirm" onclick="sendFeedback('${c.name.replace(/'/g,"")}','confirmed')">Confirm</button>
          <button class="fb-btn reject" onclick="sendFeedback('${c.name.replace(/'/g,"")}','rejected')">Reject</button>
        </div>
      </div>`;
  });

  if(data.confidence_level === "low"){
    html += `<div class="gap-box"><strong>Confidence too low to recommend action.</strong><br/>${data.data_gap}</div>`;
  }
  html += `</div>`;

  if(data.recommendations && data.recommendations.length){
    html += `<div class="stage-card"><div class="stage-title">Recommend</div>`;
    data.recommendations.forEach((r, i) => {
      html += `<div class="rec-item"><span>0${i+1}</span><span>${r}</span></div>`;
    });
    html += `</div>`;
  }

  results.innerHTML = html;

  const t = data.telemetry;
  telemetryBox.innerHTML = `
    <div class="telemetry">
      <span>latency: ${t.latency_ms}ms</span>
      <span>llm calls: ${t.llm_calls}</span>
      <span>tokens: ${t.tokens_estimated}</span>
      <span>est. cost: $${t.cost_estimated_usd}</span>
      <span>stages: ${Object.entries(t.stages).map(([k,v])=>`${k}=${v}`).join(", ")}</span>
    </div>`;
}

async function sendFeedback(causeName, verdict){
  try{
    await fetch("/api/feedback", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({investigation_id: "demo", cause_name: causeName, verdict: verdict})
    });
  } catch(err){ /* non-blocking */ }
}

renderPersonaRow();
renderScenarioRow();
loadDashboard();
</script>
</body>
</html>
